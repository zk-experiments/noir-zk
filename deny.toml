# cargo-deny configuration. Run with `cargo deny check`.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[bans]
# Noir and arkworks pull several versions of the same crates.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [{ name = "openssl" }, { name = "openssl-sys" }]

[licenses]
version = 2
confidence-threshold = 0.93
private = { ignore = true }
unused-allowed-license = "warn"
# ISC and CDLA-Permissive-2.0: rustls, ring and webpki-roots (feature `http`).
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "Unicode-3.0", "ISC", "CDLA-Permissive-2.0"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
