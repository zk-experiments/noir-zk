[workspace]
members = ["crates/noir-zk-core", "crates/noir-zk-codegen", "crates/noir-zk-backend", "crates/noir-zk-cli", "crates/noir-zk-fixtures"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/zk-experiments/noir-zk"
readme = "README.md"
keywords = ["noir", "zk", "barretenberg", "chonk", "ultrahonk"]
categories = ["cryptography"]

[workspace.dependencies]
noir-zk-core = { path = "crates/noir-zk-core", version = "=0.1.0" }
noir-zk-codegen = { path = "crates/noir-zk-codegen", version = "=0.1.0" }
noir-zk-backend = { path = "crates/noir-zk-backend", version = "=0.1.0" }
ark-ff = { version = "0.6", default-features = false }
ark-bn254 = { version = "0.6", default-features = false, features = ["curve"] }
base64 = "0.22"
flate2 = "1"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"
toml_edit = "0.23"
# barretenberg via FFI. Must be the exact bb the circuits' keys are derived
# with (mise.toml BB_VERSION): proofs only verify with the version that made them.
barretenberg-rs = { version = "=7.0.0-nightly.20260927", default-features = false, features = ["ffi"] }
# Noir ACVM witness solving, at the Noir release the circuits
# are compiled with (mise.toml NOIR_VERSION; bb 7.0.0-nightly.20260927 is built
# on exactly this commit).
acir = "=1.0.0-rc.3"
acvm = "=1.0.0-rc.3"
bn254_blackbox_solver = "=1.0.0-rc.3"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
unimplemented = "deny"
exit = "deny"
panic = "warn"
unwrap_used = "warn"

# Witness solving and proving are unusably slow unoptimised. ACVM's solver
# and Brillig VM are generic, so they are compiled into the calling crate:
# optimising only dependencies isn't enough (measured on an RSA-4096 DSC step:
# 1.3 s in dev without this, 0.17 s with it). Same as pso-zk-circuits.
[profile.dev]
opt-level = 3
